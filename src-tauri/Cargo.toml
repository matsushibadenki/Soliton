[package]
name = "soliton"
version = "0.1.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
[dependencies]
tauri = { version = "2.12.5", features = [] }
studio-core = { path = "../crates/studio-core" }
tokio = { version = "1.54.1", features = ["full"] }
serde_json = "1.0.154"

tauri-plugin-dialog = "2.8.4"

reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls"] }
futures-util = "0.3"
uuid = { version = "1.29.0", features = ["v4"] }
semver = "1"
