[package]
name = "studio-core"
version = "0.1.0"
edition = "2021"
[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
uuid = { version = "1.29.0", features = ["v4"] }
libc = "0.2.191"

tokio-stream = "0.1.19"

rusqlite = { version = "0.41.1", features = ["bundled"] }

sha2 = "0.11.1"

futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.28.0"
base64 = "0.22"
